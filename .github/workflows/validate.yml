name: Lightweight artifact validation
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python reproduction/check_english.py
      - run: python -m pip install -c environment/constraints-windows-py312.txt -e '.[reproduce]' pytest
      - run: python -m pytest tests src/privtdd/sampling -q
      - run: python -m privtdd reproduce --mode figures
      - run: python -m privtdd reproduce --mode smoke
